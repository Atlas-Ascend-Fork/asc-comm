<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Arial, 'Noto Sans CJK SC', sans-serif">
  <defs>
    <style>
      .title{font-size:20px;font-weight:700;fill:#20262d}.subtitle{font-size:14px;fill:#4b5563}.layer{font-size:14px;font-weight:700;fill:#4b5563}.group{fill:#fafbfc;stroke:#c2c8ce;stroke-width:1.3}.npu{fill:#dbeafe;stroke:#4f83c2;stroke-width:1.6}.switch{fill:#ddf0d7;stroke:#66a65c;stroke-width:1.6}.link{fill:none;stroke:#7a838b;stroke-width:1.6}.label{font-size:13px;fill:#263238}.small{font-size:13px;fill:#4b5563}
    </style>
  </defs>
  <rect width="760" height="460" fill="#fff"/>
  <text x="380" y="30" class="title" text-anchor="middle">Clos拓扑</text>
  <text x="380" y="55" class="subtitle" text-anchor="middle">NPU通过分层交换网络互联</text>

  <text x="76" y="112" class="layer">L2交换层</text>
  <text x="76" y="244" class="layer">L1交换层</text>
  <text x="76" y="365" class="layer">NPU节点</text>
  <line x1="65" y1="132" x2="695" y2="132" stroke="#d7dbe0" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="65" y1="265" x2="695" y2="265" stroke="#d7dbe0" stroke-width="1" stroke-dasharray="4 5"/>

  <rect x="160" y="188" width="190" height="205" rx="6" class="group"/>
  <rect x="410" y="188" width="190" height="205" rx="6" class="group"/>

  <!-- Links are drawn first so that node shapes remain legible. -->
  <g class="link">
    <path d="M310 125L255 220M310 125L505 220M450 125L255 220M450 125L505 220"/>
    <path d="M255 258L210 335M255 258L300 335M505 258L460 335M505 258L550 335"/>
  </g>

  <rect x="260" y="87" width="100" height="38" rx="3" class="switch"/>
  <rect x="400" y="87" width="100" height="38" rx="3" class="switch"/>
  <text x="310" y="111" class="label" text-anchor="middle">交换机</text>
  <text x="450" y="111" class="label" text-anchor="middle">交换机</text>

  <rect x="205" y="220" width="100" height="38" rx="3" class="switch"/>
  <rect x="455" y="220" width="100" height="38" rx="3" class="switch"/>
  <text x="255" y="244" class="label" text-anchor="middle">交换机</text>
  <text x="505" y="244" class="label" text-anchor="middle">交换机</text>

  <circle cx="210" cy="362" r="27" class="npu"/><circle cx="300" cy="362" r="27" class="npu"/>
  <circle cx="460" cy="362" r="27" class="npu"/><circle cx="550" cy="362" r="27" class="npu"/>
  <text x="210" y="367" class="label" text-anchor="middle">NPU</text><text x="300" y="367" class="label" text-anchor="middle">NPU</text>
  <text x="460" y="367" class="label" text-anchor="middle">NPU</text><text x="550" y="367" class="label" text-anchor="middle">NPU</text>

  <g transform="translate(270 430)">
    <circle cx="0" cy="0" r="12" class="npu"/><text x="20" y="5" class="small">NPU</text>
    <rect x="78" y="-12" width="48" height="24" rx="3" class="switch"/><text x="136" y="5" class="small">交换机</text>
    <line x1="220" y1="0" x2="270" y2="0" class="link"/><text x="280" y="5" class="small">交换链路</text>
  </g>
