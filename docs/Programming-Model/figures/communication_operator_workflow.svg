<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260" font-family="Arial, 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f3f3f"/>
    </marker>
  </defs>

  <rect width="1080" height="260" fill="#ffffff"/>
  <text x="540" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">通信算子基本流程</text>

  <rect x="34" y="52" width="322" height="158" rx="5" fill="#f4f7f9" stroke="#52616b" stroke-width="1.5"/>
  <text x="54" y="78" font-size="12" font-weight="700" fill="#25313b">控制面：HCOMM通信基础库</text>
  <rect x="90" y="102" width="210" height="64" rx="4" fill="#eef6ea" stroke="#4b8f68"/>
  <text x="195" y="139" font-size="12" text-anchor="middle" fill="#28573c">1. 资源准备</text>

  <rect x="388" y="52" width="658" height="158" rx="5" fill="#fafbfc" stroke="#52616b" stroke-width="1.5"/>
