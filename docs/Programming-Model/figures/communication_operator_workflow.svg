  <rect x="412" y="102" width="158" height="64" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="491" y="139" font-size="12" text-anchor="middle" fill="#3b3425">2. 前同步</text>
  <rect x="638" y="102" width="158" height="64" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="717" y="139" font-size="12" text-anchor="middle" fill="#3b3425">3. 算子执行</text>
  <rect x="864" y="102" width="158" height="64" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="943" y="139" font-size="12" text-anchor="middle" fill="#3b3425">4. 后同步</text>

  <g fill="none" stroke="#3f3f3f" stroke-width="1.6" marker-end="url(#flow-arrow)">
    <path d="M 300 134 H 408"/>
    <path d="M 570 134 H 634"/>
    <path d="M 796 134 H 860"/>
