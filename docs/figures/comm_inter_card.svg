<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Arial, 'Noto Sans CJK SC', sans-serif">
  <rect width="1120" height="620" fill="#ffffff"/>

  <!-- Ascend 950 supernode 1 -->
  <rect x="28" y="24" width="820" height="526" rx="4" fill="#fafbfc" stroke="#31383d" stroke-width="1.5"/>
  <text x="438" y="50" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Ascend 950 超节点1</text>

  <!-- AI cabinet 1 -->
  <rect x="54" y="76" width="610" height="340" fill="#f0f1f2" stroke="#31383d" stroke-width="1.4"/>
  <text x="635" y="102" font-size="13" font-weight="700" text-anchor="end" fill="#252b2f">AI机柜1</text>

  <!-- Third-party DPU: RoCE outward, PCIe to CPU -->
  <g fill="#fff2cc" stroke="#d6b656" stroke-width="1.2">
    <rect x="76" y="126" width="92" height="40"/>
    <rect x="83" y="119" width="92" height="40"/>
    <rect x="90" y="112" width="92" height="40"/>
  </g>
  <text x="136" y="138" font-size="12" text-anchor="middle" fill="#3b3425">第三方DPU</text>
  <path d="M 136 112 V 78" fill="none" stroke="#636d73" stroke-width="1.7"/>
  <text x="94" y="94" font-size="10" font-weight="700" fill="#252b2f">RoCE</text>

  <!-- CPU stack -->
  <g fill="#d5e8d4" stroke="#82b366" stroke-width="1.2">
    <rect x="76" y="226" width="92" height="40"/>
    <rect x="83" y="219" width="92" height="40"/>
    <rect x="90" y="212" width="92" height="40"/>
  </g>
  <text x="136" y="238" font-size="12" text-anchor="middle" fill="#28573c">CPU</text>
  <path d="M 136 166 V 212" fill="none" stroke="#636d73" stroke-width="1.7"/>
  <text x="145" y="193" font-size="10" font-weight="700" fill="#252b2f">PCIe</text>

  <!-- UB-capable DPU -->
  <g fill="#d5e8d4" stroke="#82b366" stroke-width="1.2">
    <rect x="213" y="126" width="92" height="40"/>
    <rect x="220" y="119" width="92" height="40"/>
  </g>
  <text x="266" y="145" font-size="12" text-anchor="middle" fill="#28573c">DPU</text>

  <!-- NPUs -->
  <g fill="#d5e8d4" stroke="#82b366" stroke-width="1.2">
    <rect x="320" y="212" width="80" height="54"/>
    <rect x="440" y="212" width="80" height="54"/>
    <rect x="548" y="212" width="80" height="54"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#28573c">
    <text x="360" y="244">NPU</text>
    <text x="480" y="244">NPU</text>
    <text x="588" y="244">NPU</text>
  </g>
  <text x="534" y="242" font-size="17" text-anchor="middle" fill="#4f575c">...</text>

  <!-- Components connect to L1 through UB -->
  <g fill="none" stroke="#636d73" stroke-width="1.7">
    <path d="M 136 266 V 313"/>
    <path d="M 266 166 V 313"/>
    <path d="M 360 266 V 313"/>
    <path d="M 480 266 V 313"/>
    <path d="M 588 266 V 313"/>
  </g>
  <g font-size="10" font-weight="700" fill="#252b2f">
    <text x="116" y="294">UB</text>
    <text x="274" y="295">UB</text>
    <text x="368" y="294">UB</text>
    <text x="488" y="294">UB</text>
    <text x="596" y="294">UB</text>
  </g>

  <!-- L1 switch stack -->
  <g fill="#d5e8d4" stroke="#82b366" stroke-width="1.2">
    <rect x="82" y="329" width="536" height="48"/>
    <rect x="90" y="321" width="536" height="48"/>
    <rect x="98" y="313" width="536" height="48"/>
  </g>
  <text x="366" y="342" font-size="13" font-weight="700" text-anchor="middle" fill="#28573c">L1 灵衢Switch</text>

  <!-- AI cabinet N -->
  <rect x="690" y="76" width="132" height="340" fill="#f0f1f2" stroke="#31383d" stroke-width="1.4"/>
  <text x="756" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#252b2f">AI机柜N</text>
  <text x="756" y="226" font-size="11" text-anchor="middle" fill="#525c62">CPU / NPU / DPU</text>
  <text x="756" y="248" font-size="10" text-anchor="middle" fill="#7a848a">L1灵衢Switch</text>

  <!-- L1 switches connect to L2 through UB -->
  <g fill="none" stroke="#636d73" stroke-width="1.7">
    <path d="M 366 361 V 454"/>
    <path d="M 756 416 V 500 H 692"/>
  </g>
  <g font-size="10" font-weight="700" fill="#252b2f">
    <text x="374" y="412">UB</text>
    <text x="722" y="490">UB</text>
  </g>

  <!-- L2 switch -->
  <rect x="162" y="454" width="530" height="50" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
  <text x="427" y="484" font-size="13" font-weight="700" text-anchor="middle" fill="#28573c">L2 灵衢Switch / 以太交换机</text>

  <!-- Supernode N -->
  <rect x="902" y="24" width="190" height="526" rx="4" fill="#fafbfc" stroke="#31383d" stroke-width="1.5"/>
  <text x="997" y="50" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">超节点N</text>
  <rect x="926" y="76" width="142" height="340" fill="#f0f1f2" stroke="#31383d" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="997" y="226" font-size="12" text-anchor="middle" fill="#525c62">AI机柜1~N</text>
  <text x="997" y="250" font-size="10" text-anchor="middle" fill="#7a848a">结构同超节点1</text>

  <!-- Supernodes connect through UBoE; topology lines have no direction -->
  <path d="M 590 504 V 574 H 997 V 550" fill="none" stroke="#636d73" stroke-width="1.8"/>
  <text x="800" y="567" font-size="11" font-weight="700" fill="#252b2f">UBoE</text>

  <text x="28" y="606" font-size="9" fill="#8a949c">注：连线表示双向互联关系，不表示单次通信的数据传输方向。</text>
</svg>
