name: Requirement|需求建议
description: 您需要反馈或实现一个 asc-comm 新需求时，请使用此模板。
title: "[Requirement|需求建议]: "
labels: ["requirement"]
type: "需求"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sending a requirement! Please fill in the following template to help quickly evaluate your request.
  - type: textarea
    attributes:
      label: Backgroud / 背景信息 (Mandatory / 必填)
      description: 请描述新需求的功能、目标场景，以及要解决的问题。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Origin / 信息来源 (Mandatory / 必填)
      description: 请说明需求来源，例如使用场景、团队、外部仓迁移需求、devkit/hcomm 对齐需求等。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Benefit / Necessity / 价值与作用 (Optional / 选填)
      description: 请描述该需求的收益、适用范围、是否影响公开 API、文档、样例、UT 或三方依赖清单。
    validations:
      required: false
  - type: textarea
    attributes:
      label: Design / 设计方案 (Optional / 选填)
      description: 请描述总体思路、接口变化、兼容性影响，以及与 hcomm/devkit/CANN 外部能力的依赖关系。
    validations:
      required: false
