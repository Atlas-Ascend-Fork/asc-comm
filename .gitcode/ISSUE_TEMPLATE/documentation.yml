name: Documentation|文档反馈
description: 如果您需要反馈 asc-comm 文档问题，请使用此模板。
title: "[Documentation|文档反馈]: "
labels: ["documentation"]
type: "文档"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sending an issue! Please fill in the following template to help quickly solve your problem.
  - type: textarea
    attributes:
      label: Document Link / 文档链接或路径 (Mandatory / 必填)
      description: 请给出有问题的文档链接或仓内路径，例如 `docs/api/aicore/hcomm/Hcomm.md`。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Issues Section / 问题文档片段 (Mandatory / 必填)
      description: 请给出问题章节、表格、示例、命令或截图。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Existing Issues / 存在的问题 (Optional / 选填)
      description: 请描述文档错误、缺失信息或容易误解的点。
    validations:
      required: false
  - type: textarea
    attributes:
      label: Suggested Update / 修改建议 (Optional / 选填)
      description: 请描述期望补充的约束、命令、样例、依赖或版本说明。
    validations:
      required: false
